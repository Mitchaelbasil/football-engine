name: 0006 feed simulator

on:
  workflow_dispatch:
  push: # Claude sessions commit this file instead of dispatching
    paths:
      - 0006/requests/feedsim.json
      - 0006/requests/gallery.json

concurrency:
  group: 0006-feedsim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 0006/requirements.txt
      - run: |
          pip install -r 0006/requirements.txt playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Feed test or thumbnail gallery
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q 0006/requests/gallery.json; then
            python 0006/feedsim.py --gallery
          else
            python 0006/feedsim.py
          fi
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
