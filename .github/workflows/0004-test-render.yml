name: 0004 test render

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Folder under 0004/videos"
        default: "_checkpoint"
      voice:
        description: "Voice backend (fake | kokoro:bm_george)"
        default: "kokoro:bm_george"

concurrency:
  group: 0004-render-${{ inputs.video }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VID: 0004/videos/${{ inputs.video }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 0004/requirements.txt
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
      - name: Install Python deps
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r 0004/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Build video
        run: |
          set -o pipefail
          python 0004/pipeline/build.py "$VID" --voice "${{ inputs.voice }}" --video 2>&1 | tee build.log
          echo "::notice title=plan::$(grep '^plan:' build.log)"
      - name: Report failure
        if: failure()
        run: |
          tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=build log tail::/'
      - name: Deliver to Drive + Telegram
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cp "$VID/build/timeline.json" plan.json 2>/dev/null || true
          if [ -f "$VID/out/final.mp4" ]; then NOTE="🎬 0004 test render ready: ${{ inputs.video }}"; else NOTE="❌ 0004 test render failed: ${{ inputs.video }}"; fi
          python 0004/pipeline/deliver.py --drive-path "football-engine/0004/tests/${{ inputs.video }}" --note "$NOTE" \
            "$VID/out/final.mp4" "$VID/out/contact.jpg" build.log | tail -1 | sed 's/^/::notice title=drive::/'
