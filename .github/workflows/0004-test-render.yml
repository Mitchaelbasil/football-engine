name: 0004 test render

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Folder under 0004/videos"
        default: "_checkpoint"
      voice:
        description: "Voice backend (kokoro:af_bella | chatterbox | fake)"
        default: "kokoro:af_bella"

concurrency:
  group: 0004-render-${{ inputs.video }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VID: 0004/videos/${{ inputs.video }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 0004/requirements.txt
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
      - name: Install Python deps
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r 0004/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Restore voice cache (skip re-voicing unchanged sentences)
        uses: actions/cache@v4
        with:
          path: ${{ env.VID }}/build/voice_chatterbox
          key: voice-${{ inputs.video }}-${{ github.run_id }}
          restore-keys: voice-${{ inputs.video }}-
      - name: Build video
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          source 0004/pipeline/kaggle_auth.sh
          python 0004/pipeline/build.py "$VID" --voice "${{ inputs.voice }}" --video --shorts --thumbs 2>&1 | tee build.log
          grep '^plan\[' build.log | while read -r l; do echo "::notice title=plan::$l"; done || true
          grep '^kaggle:' build.log | tail -3 | while read -r l; do echo "::notice title=voice::$l"; done || true
          if grep -q 'VOICE FALLBACK' build.log; then echo "::warning title=voice::$(grep 'VOICE FALLBACK' build.log | head -c 1500 | tr '\n' ' ')"; fi
      - name: Push review assets (contact sheet, waveform, loudness, plan)
        run: |
          R=/tmp/review; mkdir -p $R
          cp "$VID"/out/contact*.jpg "$VID"/out/thumb_*.png "$VID/build/main/timeline.json" $R/ 2>/dev/null || true
          ffmpeg -v error -i "$VID/out/final.mp4" -filter_complex "showwavespic=s=1920x300:split_channels=0" -frames:v 1 $R/wave.png
          ffmpeg -nostats -i "$VID/out/final.mp4" -af ebur128 -f null - 2>&1 | tail -12 > $R/loudness.txt
          for t in 1.5 13.5 30.5 44 60.5; do ffmpeg -v error -ss $t -i "$VID/out/final.mp4" -frames:v 1 -vf scale=960:-1 $R/f_$t.jpg; done
          cd $R && git init -q && git checkout -q -b review && git add . && git -c user.name=render-bot -c user.email=bot@users.noreply.github.com commit -qm "review ${{ inputs.video }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "review:review/${{ inputs.video }}"
      - name: Report failure
        if: failure()
        run: |
          tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=build log tail::/'
      - name: Deliver to Drive + Telegram
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cp "$VID/build/timeline.json" plan.json 2>/dev/null || true
          if [ -f "$VID/out/final.mp4" ]; then NOTE="🎬 0004 test render ready: ${{ inputs.video }}"; grep -q 'VOICE FALLBACK' build.log && NOTE="$NOTE (⚠️ Kokoro fallback voice)"; else NOTE="❌ 0004 test render failed: ${{ inputs.video }}"; fi
          python 0004/pipeline/deliver.py --drive-path "football-engine/0004/tests/${{ inputs.video }}" --note "$NOTE" \
            "$VID"/out/*.mp4 "$VID"/out/thumb_*.png "$VID"/out/*.txt build.log | tail -1 | sed 's/^/::notice title=drive::/'
