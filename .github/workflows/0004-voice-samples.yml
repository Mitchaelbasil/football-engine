name: 0004 voice samples

# Renders the same narration in several candidate voices so Mitchael can pick by ear.
# Samples land in Drive football-engine/0004/voice/samples (+ Telegram ping).

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Kokoro voices, comma separated"
        default: "af_heart,af_bella,af_nicole,bf_emma,bf_isabella"
      text:
        description: "Narration (sentences separated by |)"
        default: "Sixty goals in a single season.|For almost any player in history, that would be the year of a lifetime.|But five hundred kilometres away, someone was playing a different game.|Lionel Messi. Seventy-three goals."

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro==0.9.4 soundfile numpy google-api-python-client==2.151.0 google-auth==2.36.0
      - name: Render samples
        env:
          VOICES: ${{ inputs.voices }}
          TEXT: ${{ inputs.text }}
        run: |
          mkdir -p /tmp/s && python - <<'EOF'
          import os, sys, subprocess
          import numpy as np, soundfile as sf
          sys.path.insert(0, "0004/pipeline")
          from voice import _kokoro_synth, SR
          lines = [l.strip() for l in os.environ["TEXT"].split("|") if l.strip()]
          for i, v in enumerate([x.strip() for x in os.environ["VOICES"].split(",") if x.strip()], 1):
              parts = []
              for l in lines:
                  a, _ = _kokoro_synth(l, v)
                  parts += [a, np.zeros(int(.45 * SR), dtype=np.float32)]
              sf.write(f"/tmp/s/{v}.wav", np.concatenate(parts), SR)
              subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", f"/tmp/s/{v}.wav", "-af", "loudnorm=I=-16", "-b:a", "160k", f"/tmp/s/{i}_{v}.mp3"], check=True)
              print("::notice title=sample::", v)
          EOF
      - name: Upload to Drive + Telegram
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python 0004/pipeline/deliver.py --drive-path football-engine/0004/voice/samples --note "🎙️ 0004 female voice samples ready - pick one" /tmp/s/*.mp3 | tail -1 | sed 's/^/::notice title=drive::/'
